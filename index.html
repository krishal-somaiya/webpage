<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DevOps Practical</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding-top: 100px;
            margin: 0;
        }

        .container {
            background: white;
            display: inline-block;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2b5876;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .status {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>DevOps Practical Exam</h1>
        <p>Deployed successfully</p>
        <p>Status: <span class="status">Running Live</span></p>
    </div>
</body>

</html>
